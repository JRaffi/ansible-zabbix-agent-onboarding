# Hosts that should get the Zabbix agent.
# Replace the examples, then run:  ansible-playbook install_agent.yml

[linux]
# web01.example.com
# db01.example.com  ansible_host=10.0.0.12

# Hosts that run Zabbix themselves (server or proxy). They only accept passive
# checks from localhost - see group_vars/zabbix_infra.yml.
[zabbix_infra]
# zbx-proxy01.example.com

[all:vars]
ansible_user = ansible
ansible_python_interpreter = /usr/bin/python3
