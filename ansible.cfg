[defaults]
inventory = inventory.ini
roles_path = roles

# Keep integers as integers when templating. The Zabbix API rejects "1" where
# it expects 1, and without this every Jinja expression returns a string.
jinja2_native = True

# Facts are needed (ansible_fqdn, ansible_distribution) but the default set is
# large - smart gathering keeps repeated runs fast.
gathering = smart

# Readable task output without pulling in a callback collection.
callback_result_format = yaml
