[defaults]
inventory = inventory.ini
roles_path = roles

# No jinja2_native here on purpose: integers have to stay integers, because the
# Zabbix API rejects "1" where it expects 1 - and since ansible-core 2.19 that
# is the default and only mode. The option itself is removed in 2.23.

# Facts are needed (ansible_facts.fqdn, ansible_facts.distribution) but the
# default set is large - smart gathering keeps repeated runs fast.
gathering = smart

# Facts are read as ansible_facts.* everywhere, so the top-level ansible_fqdn
# style copies are not needed. Their auto-injection is deprecated and goes away
# in ansible-core 2.24 - saying so here keeps the output free of the warning.
inject_facts_as_vars = False

# Readable task output without pulling in a callback collection.
callback_result_format = yaml
