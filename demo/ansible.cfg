[defaults]
inventory = /repo/demo/inventory.ini
jinja2_native = True
gathering = smart
# Readable task output without pulling in a callback collection.
callback_result_format = yaml
# Containers get a fresh host key on every rebuild - pointless to verify here.
host_key_checking = False
# /repo is a bind mount; keep the controller scratch files out of it.
local_tmp = /tmp/ansible-local

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
